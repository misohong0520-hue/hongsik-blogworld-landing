server {
    listen 80;
    listen [::]:80;
    server_name blogworld.hongsik.blog;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/hongsik-blogworld/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://blogworld.hongsik.blog$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blogworld.hongsik.blog;
    root /var/www/hongsik-blogworld/current;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/blogworld.hongsik.blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blogworld.hongsik.blog/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/hongsik-blogworld/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
