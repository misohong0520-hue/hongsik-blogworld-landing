# Bootstrap HTTP site and ACME webroot before issuing the first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name blogworld.hongsik.blog;
    root /var/www/hongsik-blogworld/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/hongsik-blogworld/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
